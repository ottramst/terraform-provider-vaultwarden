name: Issue Comment Triage

on:
  # zizmor: ignore[dangerous-triggers] -- the job checks out no code and runs
  # no untrusted input: it only removes a label, passing the URL via env.
  issue_comment:
    types: [created]

permissions: {}

jobs:
  issue_comment_triage:
    # Only when the label is present, so most comments don't start a job.
    if: contains(github.event.issue.labels.*.name, 'waiting-response')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      # issue_comment events are triggered by comments on issues and pull requests. Checking the
      # value of github.event.issue.pull_request tells us whether the issue is an issue or is
      # actually a pull request, allowing us to dynamically set the gh subcommand:
      # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#issue_comment-on-issues-only-or-pull-requests-only
      COMMAND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
    steps:
      - name: 'Remove waiting-response on comment'
        run: gh "$COMMAND" edit "$ISSUE_URL" --remove-label waiting-response
