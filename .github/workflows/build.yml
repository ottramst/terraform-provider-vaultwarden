name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy && (cd tools && go mod tidy)
          git diff --compact-summary --exit-code -- go.mod go.sum tools/go.mod tools/go.sum || \
            (echo; echo "go.mod/go.sum are not tidy. Run 'go mod tidy' (also in tools/) and commit."; exit 1)
      - run: make build-ci
      - run: make test
