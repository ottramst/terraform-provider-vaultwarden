name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: make build-ci
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: terraform-provider-vaultwarden
