name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Terraform Provider Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAULTWARDEN_ENDPOINT: http://localhost:8000
      # VW_VERSION selects the docker-compose.yml image tag.
      VW_VERSION: ${{ matrix.vaultwarden-version }}
    strategy:
      fail-fast: false
      matrix:
        # Only the latest two Vaultwarden minor releases are tested (latest
        # patch of each). Older versions get best-effort support only (see
        # README). Keep the default in docker-compose.yml in sync.
        vaultwarden-version:
          - '1.36.0'
          - '1.37.4'
        # Only non-EOL Terraform releases: HashiCorp supports the two newest
        # minor versions, so drop the oldest entry when a new minor ships.
        terraform-version:
          - '1.16.*'
          - '1.17.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false
      - name: Start Vaultwarden
        run: docker compose up -d --wait
      - run: go mod download
      - run: make testacc
