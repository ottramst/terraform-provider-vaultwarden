name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    uses: ./.github/workflows/generate.yml
    permissions:
      contents: read
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Single required status check for branch protection: it always reports,
  # and fails if any job above failed, was cancelled or was skipped.
  ci-gate:
    name: CI gate
    if: always()
    needs: [generate, lint, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
